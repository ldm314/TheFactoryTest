# Application + Postgres + Redpanda (Kafka-compatible). Emitted when a
# component suggests kafka-producer / names a broker in its contract.
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - app-data:/var/lib/postgresql/data

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://127.0.0.1:19092
    ports:
      - "${KAFKA_PORT:-19092}:19092"

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@database:5432/app
      KAFKA_BOOTSTRAP: redpanda:9092
      PORT: "8080"
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
      redpanda:
        condition: service_started

volumes:
  app-data:
