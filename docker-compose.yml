# The application and the database it owns. Generated; not edited by hand.
#
# docs/11 §3: one cluster per product area, one schema per service. The schema
# is created by each component at startup from the files in migrations/.
services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      # The codebase is disposable and the database is not (docs/11 §1).
      - app-data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://app:app@database:5432/app
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  app-data:
